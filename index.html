<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Defeat Frank! | Games We Miss</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="scanlines"></div>
  
  <div id="login-screen">
    <div class="login-box">
      <h2 class="title">COMPANY PORTAL</h2>
      <p>Enter your Employee ID to clock in.</p>
      <input type="text" id="username-input" placeholder="USERNAME..." maxlength="15">
      <button id="btn-clock-in" class="vapor-btn attack-btn">CLOCK IN</button>
    </div>
  </div>

  <div id="employee-container"></div>
  
  <div id="game-container" style="display: none;">
    <h1 id="boss-name" class="title">CORPORATE FRANK</h1>
    
    <div id="boss-area">
      <img id="boss-image" src="boss-standing.png" alt="Boss">
      <div id="flash-overlay"></div>
    </div>

    <div id="health-bar-container">
      <div id="health-bar-fill"></div>
      <span id="health-text">Connecting...</span>
    </div>

    <div id="frenzy-container">
      <div id="frenzy-bar-fill"></div>
      <span id="frenzy-text">CHARGE METER</span>
    </div>

    <div id="player-stats">
      <p>VAPOR COINS: <span id="coin-count">0</span></p>
      <p>CLICK DMG: <span id="click-power">2,500</span> | AUTO: <span id="auto-power">0</span>/sec</p>
    </div>

    <div class="action-buttons">
      <button id="btn-attack" class="vapor-btn attack-btn">⚔️ ATTACK!</button>
      <button id="btn-tip" class="vapor-btn tip-btn">💥 HIRE PREMIUM MERCENARY (Tip)</button>
    </div>

    <div id="shop">
      <h2 class="shop-title">-- UPGRADES --</h2>
      <button id="buy-click" class="shop-btn">Sharpen Blade (+2.5k) <br><span>Cost: 10</span></button>
      <button id="buy-auto" class="shop-btn">Hire Merc (+1k/s) <br><span>Cost: 50</span></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
