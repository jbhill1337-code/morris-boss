<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Defeat Frank! | Games We Miss</title>
  <link rel="stylesheet" href="style.css?v=31">
</head>
<body>
  <div class="scanlines"></div>
  
  <div id="intro-container">
    <button id="start-intro-btn" class="vapor-btn" style="display: none;">INITIALIZE SYSTEM</button>
    <div id="yt-player" style="display: none; width: 100%; height: 100%; pointer-events: none;"></div>
    <button id="skip-intro-btn" class="vapor-btn" style="display: none;">SKIP</button>
  </div>
  
  <div id="login-screen">
    <div class="login-box">
      <h2 class="title">COMPANY PORTAL</h2>
      <p>Enter your Employee ID to clock in.</p>
      <input type="text" id="username-input" placeholder="USERNAME..." maxlength="15">
      <button id="btn-clock-in" class="vapor-btn attack-btn">CLOCK IN</button>
    </div>
  </div>

  <div id="employee-container"></div>
  
  <div id="game-container" style="display: none;">
    <h1 id="boss-name" class="title">CORPORATE DAVE</h1>
    
    <div id="game-wrapper">
      <div class="side-col" id="left-col">
        <div id="player-stats">
          <p>VAPOR COINS: <span id="coin-count">0</span></p>
          <p>CLICK DMG: <span id="click-power">2,500</span></p>
          <p>AUTO DMG: <span id="auto-power">0</span>/sec</p>
          <p style="color: #f1c40f;">LOOT BONUS: +<span id="loot-buff">0</span>%</p>
        </div>

        <div id="shop">
          <h2 class="shop-title">-- UPGRADES --</h2>
          <button id="buy-click" class="shop-btn">Sharpen Blade (+2.5k) <br><span>Cost: <span id="cost-click">10</span></span></button>
          <button id="buy-auto" class="shop-btn">Hire Merc (+1k/s) <br><span>Cost: <span id="cost-auto">50</span></span></button>
          <button id="btn-access-mainframe" class="shop-btn" style="border-color: #0f0; color: #0f0; margin-top: 15px;">💻 ACCESS MAINFRAME (Phishing)</button>
        </div>
      </div>

      <div id="center-col">
        <div id="boss-area">
          <img id="boss-image" class="center-phase-1" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Boss Body">
          <img id="boss-hit-layer" class="center-phase-1" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
          <div id="flash-overlay"></div>
        </div>

        <div id="health-bar-container">
          <div id="health-bar-fill"></div>
          <span id="health-text">Connecting...</span>
        </div>

        <div id="frenzy-container">
          <div id="frenzy-bar-fill"></div>
          <span id="frenzy-text">CHARGE METER</span>
        </div>

        <div class="action-buttons">
          <button id="btn-attack" class="vapor-btn attack-btn" style="width: 100%;">⚔️ ATTACK!</button>
        </div>
      </div>

      <div class="side-col" id="right-col">
        <div id="inventory-panel">
          <h2 class="shop-title">-- DESK DRAWER --</h2>
          <p style="text-align:center; font-size: 10px; color:#aaa;">Items grant permanent DMG buffs!</p>
          <div id="inventory-grid"></div>
        </div>
      </div>
    </div> 
  </div>

  <div id="richard-event-container">
    <div id="richard-dialogue"></div>
    <img id="richard-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
  </div>

  <div id="phishing-minigame" style="display: none;">
    <div class="terminal-window">
      <h2 class="terminal-header">MAINFRAME TERMINAL v1.0</h2>
      <div id="phishing-screen">
        <img id="minigame-hand" src="morris-boss-v3/minigame/click_frame1.png" alt="Hacking...">
        <div class="phishing-bar-container">
          <div class="phishing-sweet-spot"></div>
          <div id="phishing-cursor"></div>
        </div>
        <button id="btn-phish" class="vapor-btn" style="width: 100%; margin-bottom: 10px; background: #004400; border-color: #0f0; color: #0f0;">EXECUTE_HACK.exe</button>
        <button id="btn-close-terminal" class="vapor-btn" style="width: 100%; background: #440000; border-color: #f00; color: #f00;">DISCONNECT</button>
      </div>
      <p id="phishing-status">Awaiting input...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js?v=31"></script>
</body>
</html>
