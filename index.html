<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defeat Morris! | Games We Miss</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  
  <div id="game-container">
    <h1 class="title">MORRIS: CORPORATE OVERLORD</h1>
    
    <div id="boss-area">
      <img id="boss-image" src="https://cdn.discordapp.com/attachments/479148520935522315/1475856129144787004/latest.png?ex=699f01a1&is=699db021&hm=480f18c6fa336d8d1f8bca88cefd4b5d9677c55df0d66adbddad15fa87ca48e0&" alt="Morris">
      <div id="flash-overlay"></div>
    </div>

    <div id="health-bar-container">
      <div id="health-bar-fill"></div>
      <span id="health-text">Loading...</span>
    </div>

    <div id="player-stats">
      <p>VAPOR COINS: <span id="coin-count">0</span></p>
      <p>CLICK DMG: <span id="click-power">2,500</span> | AUTO DMG: <span id="auto-power">0</span>/sec</p>
    </div>

    <div class="action-buttons">
      <button id="btn-attack" class="vapor-btn attack-btn">⚔️ ATTACK!</button>
    </div>

    <div id="shop">
      <h2 class="shop-title">-- UPGRADES --</h2>
      <button id="buy-click" class="shop-btn">Sharpen Blade (+2.5k Dmg) <br><span>Cost: 10 Coins</span></button>
      <button id="buy-auto" class="shop-btn">Hire Mercenary (+1k Auto/sec) <br><span>Cost: 50 Coins</span></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
