<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Defeat Frank! | Games We Miss</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  
  <div id="game-container">
    <h1 id="boss-name" class="title">CORPORATE FRANK: THE SUIT</h1>
    
    <div id="boss-area">
      <img id="boss-image" src="https://cdn.discordapp.com/attachments/479148520935522315/1475916443076792321/Gemini_Generated_Image_ko01sxko01sxko01.png?ex=699f39cd&is=699de84d&hm=964b3b8c2e6053e65ba214d3806b0fec519e054f650690138a9eecb97e99c638&" alt="Corporate Frank">
      <div id="flash-overlay"></div>
    </div>

    <div id="health-bar-container">
      <div id="health-bar-fill"></div>
      <span id="health-text">Loading Data...</span>
    </div>

    <div id="frenzy-container">
      <div id="frenzy-bar-fill"></div>
      <span id="frenzy-text">CHARGE METER</span>
    </div>

    <div id="player-stats">
      <p>VAPOR COINS: <span id="coin-count">0</span></p>
      <p>CLICK DMG: <span id="click-power">2,500</span> | AUTO: <span id="auto-power">0</span>/sec</p>
    </div>

    <div class="action-buttons">
      <button id="btn-attack" class="vapor-btn attack-btn">⚔️ ATTACK!</button>
      <button id="btn-tip" class="vapor-btn tip-btn">💥 HIRE PREMIUM MERCENARY (Tip)</button>
    </div>

    <div id="shop">
      <h2 class="shop-title">-- UPGRADES --</h2>
      <button id="buy-click" class="shop-btn">Sharpen Blade (+2.5k Dmg) <br><span>Cost: 10 Coins</span></button>
      <button id="buy-auto" class="shop-btn">Hire Mercenary (+1k Auto/sec) <br><span>Cost: 50 Coins</span></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js?v=frank_final_v2"></script>
</body>
</html>
