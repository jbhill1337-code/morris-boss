<script>
/* =========================
   RPG SYSTEM MODULE
   ========================= */

const TILE_SIZE = 64;
const ATLAS_PATH = "/sliced"; // your sliced folder

let inventory = [];
let equipment = {
  click: null,
  auto: null,
  global: null
};

const rarityWeights = {
  common: 60,
  uncommon: 25,
  rare: 10,
  epic: 4,
  legendary: 1
};

const rarities = Object.keys(rarityWeights);

/* ===== AUTO GENERATE 200 ITEMS ===== */

function randomRarity() {
  const roll = Math.random() * 100;
  let total = 0;
  for (let r in rarityWeights) {
    total += rarityWeights[r];
    if (roll <= total) return r;
  }
  return "common";
}

function generateLootPool() {
  const pool = [];
  for (let i = 0; i < 200; i++) {
    const rarity = randomRarity();
    pool.push({
      id: "item_" + i,
      icon: "icon_" + i + ".png",
      rarity,
      type: ["click","auto","global"][Math.floor(Math.random()*3)],
      multiplier: 1 + (Math.random() * (rarity === "legendary" ? 2 : 0.5))
    });
  }
  return pool;
}

const LOOT_POOL = generateLootPool();

/* ===== DROP SYSTEM ===== */

function rollDrop() {
  if (Math.random() < 0.25) { // 25% drop chance per hit
    const item = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
    inventory.push(item);
    renderInventory();
  }
}

/* ===== INVENTORY RENDER ===== */

function renderInventory() {
  const inv = document.getElementById("inventory");
  inv.innerHTML = "";

  inventory.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = `item rarity-${item.rarity}`;
    div.style.backgroundImage = `url(${ATLAS_PATH}/${item.icon})`;
    div.draggable = true;

    div.addEventListener("dragstart", e => {
      e.dataTransfer.setData("index", index);
    });

    inv.appendChild(div);
  });
}

/* ===== DRAG + EQUIP ===== */

document.querySelectorAll(".slot").forEach(slot => {
  slot.addEventListener("dragover", e => e.preventDefault());

  slot.addEventListener("drop", e => {
    const index = e.dataTransfer.getData("index");
    const item = inventory[index];

    if (item.type === slot.dataset.type) {
      equipment[item.type] = item;
      inventory.splice(index,1);
      renderInventory();
      updateDamage();
      slot.style.backgroundImage = `url(${ATLAS_PATH}/${item.icon})`;
      slot.style.backgroundSize = "cover";
    }
  });
});

/* ===== DAMAGE MODIFIER ===== */

let critChance = 0.1;
let critMulti = 2;

function updateDamage() {
  let totalMulti = 1;

  Object.values(equipment).forEach(item => {
    if (item) totalMulti *= item.multiplier;
  });

  window.rpgMultiplier = totalMulti;
}

/* ===== CRIT SYSTEM ===== */

function applyCrit(dmg) {
  if (Math.random() < critChance) {
    playFX();
    return dmg * critMulti;
  }
  return dmg;
}

/* ===== FX SYSTEM ===== */

const fxCanvas = document.getElementById("fx-layer");
const fxCtx = fxCanvas.getContext("2d");
fxCanvas.width = window.innerWidth;
fxCanvas.height = window.innerHeight;

const fxImage = new Image();
fxImage.src = ATLAS_PATH + "/icon_500.png";

function playFX() {
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  fxCtx.drawImage(
    fxImage,
    window.innerWidth/2 - 64,
    window.innerHeight/2 - 64,
    128,
    128
  );
  setTimeout(()=> fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height), 150);
}

/* ===== PHASE VISUALS ===== */

function updatePhaseVisual(phase) {
  const colors = {
    1: "#222",
    2: "#441111",
    3: "#220044",
    4: "#550000"
  };
  document.body.style.background = colors[phase] || "#111";
}

/* ===== SAFE HOOK INTO YOUR DAMAGE ===== */

const originalDealDamage = window.dealDamage;

window.dealDamage = function(amount) {
  if (!amount) return;

  let modified = amount * (window.rpgMultiplier || 1);
  modified = applyCrit(modified);

  if (originalDealDamage) {
    originalDealDamage(modified);
  }

  rollDrop();
};

/* INIT */
renderInventory();
updateDamage();
</script>
