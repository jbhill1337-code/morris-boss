<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boss Clicker RPG</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    h1 { margin-top: 20px; }

    #boss {
      margin: 40px auto;
      width: 200px;
      height: 200px;
      background: crimson;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      user-select: none;
    }

    #hp {
      margin-top: 10px;
      font-size: 18px;
    }

    /* ===== RPG UI ===== */

    #rpg-ui {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 360px;
      background: #1a1a1a;
      padding: 10px;
      border: 2px solid #333;
      font-size: 14px;
    }

    #inventory-grid {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      gap: 6px;
      margin-bottom: 10px;
    }

    .item {
      width: 64px;
      height: 64px;
      background-size: cover;
      image-rendering: pixelated;
      cursor: grab;
    }

    .equip-slot {
      width: 64px;
      height: 64px;
      border: 2px dashed #555;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      font-size: 12px;
      color: #aaa;
    }

    .rarity-common { border: 2px solid #777; }
    .rarity-uncommon { border: 2px solid #2ecc71; }
    .rarity-rare { border: 2px solid #3498db; }
    .rarity-epic { border: 2px solid #9b59b6; }
    .rarity-legendary { border: 2px solid #f39c12; }

    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<h1>Boss Clicker RPG</h1>

<div id="boss">CLICK</div>
<div id="hp">Boss HP: 1000</div>

<!-- RPG UI -->
<div id="rpg-ui">
  <h3>Inventory</h3>
  <div id="inventory-grid"></div>

  <h3>Equipment</h3>
  <div>
    <div class="equip-slot" data-type="click">Click</div>
    <div class="equip-slot" data-type="auto">Auto</div>
    <div class="equip-slot" data-type="global">Global</div>
  </div>
</div>

<canvas id="fx-canvas"></canvas>

<script>
/* ===============================
   BASIC BOSS SYSTEM
=================================*/

let bossHP = 1000;
const bossEl = document.getElementById("boss");
const hpEl = document.getElementById("hp");

function dealDamage(amount) {
  bossHP -= amount;
  if (bossHP < 0) bossHP = 0;
  hpEl.textContent = "Boss HP: " + Math.floor(bossHP);
}

bossEl.addEventListener("click", function() {
  let baseDamage = 10;
  let modified = baseDamage * rpgMultiplier;
  modified = applyCrit(modified);
  dealDamage(modified);
  rollDrop();
});

/* ===============================
   RPG SYSTEM
=================================*/

const inventory = [];
const equipment = { click:null, auto:null, global:null };
let rpgMultiplier = 1;

/* Generate 200 items */
function randomRarity() {
  const roll = Math.random() * 100;
  if (roll < 60) return "common";
  if (roll < 85) return "uncommon";
  if (roll < 95) return "rare";
  if (roll < 99) return "epic";
  return "legendary";
}

function generateItems() {
  const items = [];
  for (let i = 0; i < 200; i++) {
    items.push({
      id: "item_"+i,
      icon: "",
      rarity: randomRarity(),
      type: ["click","auto","global"][Math.floor(Math.random()*3)],
      multiplier: 1 + (Math.random()*1.5)
    });
  }
  return items;
}

const LOOT_POOL = generateItems();

/* Inventory */
function renderInventory() {
  const grid = document.getElementById("inventory-grid");
  grid.innerHTML = "";

  inventory.forEach((item, index)=>{
    const div = document.createElement("div");
    div.className = "item rarity-"+item.rarity;
    div.style.background = "#222";
    div.draggable = true;

    div.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("index", index);
    });

    grid.appendChild(div);
  });
}

/* Equip */
document.querySelectorAll(".equip-slot").forEach(slot=>{
  slot.addEventListener("dragover", e=>e.preventDefault());

  slot.addEventListener("drop", e=>{
    const index = e.dataTransfer.getData("index");
    const item = inventory[index];

    if(item && item.type === slot.dataset.type){
      equipment[item.type] = item;
      inventory.splice(index,1);
      slot.style.background = "#444";
      calculateMultiplier();
      renderInventory();
    }
  });
});

function calculateMultiplier(){
  rpgMultiplier = 1;
  Object.values(equipment).forEach(item=>{
    if(item) rpgMultiplier *= item.multiplier;
  });
}

/* Drop System */
function rollDrop(){
  if(Math.random() < 0.20){
    const item = LOOT_POOL[Math.floor(Math.random()*LOOT_POOL.length)];
    inventory.push(item);
    renderInventory();
  }
}

/* Crit System */
function applyCrit(dmg){
  if(Math.random() < 0.1){
    playFX();
    return dmg * 2;
  }
  return dmg;
}

/* FX System */
const fxCanvas = document.getElementById("fx-canvas");
const fxCtx = fxCanvas.getContext("2d");
fxCanvas.width = window.innerWidth;
fxCanvas.height = window.innerHeight;

function playFX(){
  fxCtx.fillStyle = "rgba(255,0,0,0.5)";
  fxCtx.fillRect(window.innerWidth/2-50,window.innerHeight/2-50,100,100);
  setTimeout(()=>fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height),100);
}

renderInventory();

</script>

</body>
</html>
